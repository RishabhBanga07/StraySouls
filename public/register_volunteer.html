<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration - StrayCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-paw"></i> StrayCare</a>
            <a href="index.html" class="btn btn-outline" style="padding: 5px 15px; font-size: 0.9rem;">Back</a>
        </div>
    </nav>

    <div class="container" style="padding: 3rem 20px;">
        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <h2 class="text-center mb-1 text-primary">Join as a Volunteer</h2>
            <p class="text-center mb-2">Help us make a difference in the lives of stray animals.</p>

            <form onsubmit="handleVolunteerReg(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Location / Areas You Can Cover</label>
                    <input type="text" class="form-control" placeholder="e.g. Downtown, North Side" required>
                </div>

                <div class="form-group">
                    <label>Skills / How can you help?</label>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-weight: normal;"><input type="checkbox"> Fostering (Temporary Home)</label>
                        <label style="font-weight: normal;"><input type="checkbox"> Transportation (Vet Visits)</label>
                        <label style="font-weight: normal;"><input type="checkbox"> Rescue Operations</label>
                        <label style="font-weight: normal;"><input type="checkbox"> Photography / Social Media</label>
                        <label style="font-weight: normal;"><input type="checkbox"> Medical Aid (Vet/Vet Tech)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Availability</label>
                    <select class="form-control">
                        <option>Weekends Only</option>
                        <option>Weekdays (Evenings)</option>
                        <option>Flexible</option>
                        <option>On-Call for Emergencies</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        function handleVolunteerReg(e) {
            e.preventDefault();
            showAlert("Registration Successful! Welcome to the team.");
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }
    </script>
</body>

</html>
